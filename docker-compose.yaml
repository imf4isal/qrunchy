services:
  mono:
    container_name: qrunchy
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pnpm install --force && pnpm dev"
    ports:
      - "${HOST_FRONTEND_PORT:-5174}:5173"
      - "${HOST_BACKEND_PORT:-3001}:${PORT:-3001}"
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PORT: ${PORT:-3001}
      # Server Configuration
      FRONTEND_URL: ${FRONTEND_URL}
      VITE_BACKEND_URL: ${VITE_BACKEND_URL:-http://localhost:3001}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # OTP Configuration
      OTP_RATE_LIMIT_MAX: ${OTP_RATE_LIMIT_MAX:-20}
      OTP_MASTER_PASSWORD: ${OTP_MASTER_PASSWORD}
      SMS_ORBIS_API_KEY: ${SMS_ORBIS_API_KEY}
      SMS_ORBIS_SENDER_ID: ${SMS_ORBIS_SENDER_ID}
      # Cloudflare R2 Configuration
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./:/app
    networks:
      - qrunchy-network
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: qrunchy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "${HOST_DB_PORT:-5434}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qrunchy-network

networks:
  qrunchy-network:
    driver: bridge

volumes:
  postgres_data:
