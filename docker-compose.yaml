services:
  mono:
    container_name: qrunchy
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    working_dir: /app
    command: sh -c "pnpm install --force && pnpm dev"
    ports:
      - target: 5173
        published: 5173
      - target: 3000
        published: 3000
    environment:
      NODE_ENV: ${NODE_ENV:-development}
      DB_HOST: ${DB_HOST}
      DB_PORT: ${DB_PORT}
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      # Server Configuration
      FRONTEND_URL: ${FRONTEND_URL}
      # JWT Configuration
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN}
      # OTP Configuration
      OTP_MASTER_PASSWORD: ${OTP_MASTER_PASSWORD}
      SMS_ORBIS_API_KEY: ${SMS_ORBIS_API_KEY}
      SMS_ORBIS_SENDER_ID: ${SMS_ORBIS_SENDER_ID}
      # Cloudflare R2 Configuration
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
    volumes:
      - ./:/app
    networks:
      - qrunchy-network
    depends_on:
      - postgres

  postgres:
    image: postgres:15
    container_name: qrunchy-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - target: 5432
        published: 5432
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - qrunchy-network

networks:
  qrunchy-network:
    driver: bridge

volumes:
  postgres_data:
