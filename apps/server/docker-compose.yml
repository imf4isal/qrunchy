name: qrunchy-server
services:
  nginx:
    container_name: qrunchy-nginx
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
    depends_on:
      - qrunchy-server
    networks:
      - qrunchy-network

  certbot:
    container_name: qrunchy-certbot
    image: certbot/certbot
    restart: "no"
    volumes:
      - certbot-etc:/etc/letsencrypt
      - certbot-var:/var/lib/letsencrypt
      - ./webroot:/var/www/html
    entrypoint: "/bin/sh -c 'trap exit TERM; while :; do certbot renew; sleep 12h & wait $${!}; done;'"

  qrunchy-server:
    container_name: qrunchy-server
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "3000"
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      # Database Configuration
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-qrunchy_db}
      DB_USER: ${DB_USER:-qrunchy}
      DB_PASSWORD: ${DB_PASSWORD:-qrunchy_password}
      # Cloudflare R2 Configuration
      R2_BUCKET_NAME: ${R2_BUCKET_NAME}
      R2_ENDPOINT: ${R2_ENDPOINT}
      R2_PUBLIC_URL: ${R2_PUBLIC_URL}
      R2_ACCESS_KEY_ID: ${R2_ACCESS_KEY_ID}
      R2_SECRET_ACCESS_KEY: ${R2_SECRET_ACCESS_KEY}
      # Frontend URL for CORS
      FRONTEND_URL: ${FRONTEND_URL:-https://qrunchy.menu}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - qrunchy-network

  postgres:
    container_name: qrunchy-postgres
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-qrunchy_db}
      POSTGRES_USER: ${DB_USER:-qrunchy}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-qrunchy_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-qrunchy} -d ${DB_NAME:-qrunchy_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - qrunchy-network

networks:
  qrunchy-network:
    driver: bridge

volumes:
  postgres_data:
    driver: local
  certbot-etc:
    driver: local
  certbot-var:
    driver: local